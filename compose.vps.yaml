name: ttw-translation

x-node: &node
  image: ttw-translation-app:local
  pull_policy: never
  init: true

x-database-env: &database-env
  DATABASE_URL: mysql://translation:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@mysql:3306/translation

x-queue-env: &queue-env
  REDIS_URL: redis://redis:6379

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--default-time-zone=+00:00"]
    environment:
      MYSQL_DATABASE: translation
      MYSQL_USER: translation
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  setup:
    <<: *node
    build: .
    command: ["sh", "-c", "node dist/scripts/setup.js migrate && node dist/scripts/setup.js seed"]
    environment:
      <<: *database-env
      NODE_ENV: ${NODE_ENV:-production}
      ALLOW_MOCK_TRANSLATION: ${ALLOW_MOCK_TRANSLATION:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      PILOT_HOST: ${PILOT_HOST:-}
      PILOT_ORIGIN: ${PILOT_ORIGIN:-}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      DEEPL_COST_INR_PER_MILLION: ${DEEPL_COST_INR_PER_MILLION:-0}
    depends_on:
      mysql:
        condition: service_healthy

  api:
    <<: *node
    restart: unless-stopped
    environment:
      <<: [*database-env, *queue-env]
      NODE_ENV: ${NODE_ENV:-production}
      BIND_HOST: 0.0.0.0
      SOURCE_HOST: ${SOURCE_HOST:?Set SOURCE_HOST}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET}
      WEBHOOK_API_KEY: ${WEBHOOK_API_KEY:?Set WEBHOOK_API_KEY}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8200}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    <<: *node
    restart: unless-stopped
    command: ["node", "dist/apps/web/src/main.js"]
    environment:
      <<: *database-env
      BIND_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8201}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/liveness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    <<: *node
    restart: unless-stopped
    stop_grace_period: 45s
    command: ["node", "dist/apps/worker/src/main.js"]
    environment:
      <<: [*database-env, *queue-env]
      NODE_ENV: ${NODE_ENV:-production}
      ALLOW_MOCK_TRANSLATION: ${ALLOW_MOCK_TRANSLATION:-false}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
