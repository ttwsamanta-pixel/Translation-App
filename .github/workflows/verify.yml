name: Verify pilot

on: [push, pull_request]
permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: php -l wordpress-plugin/translation-connector/translation-connector.php
      - run: docker compose up -d --wait
      - name: Migrate, seed, and exercise the pilot
        shell: bash
        run: |
          cp .env.example .env
          npm run migrate
          npm run seed
          node dist/apps/api/src/main.js > api.log 2>&1 &
          node dist/apps/worker/src/main.js > worker.log 2>&1 &
          node dist/apps/web/src/main.js > web.log 2>&1 &
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/ready
          npm run smoke
      - name: Verify isolated VPS Compose deployment
        shell: bash
        env:
          NODE_ENV: production
          ADMIN_EMAIL: admin@example.test
          SOURCE_HOST: wordpress.example
        run: |
          bash deployment/prepare-vps.sh
          docker compose --env-file .env.vps -f compose.vps.yaml up -d --build --wait
          curl -fsS http://127.0.0.1:8200/ready
          node --env-file=.env.vps --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root = 'http://127.0.0.1:8200/api/v1/';
          const json = async (path, body, token, method = body ? 'POST' : 'GET') => {
            const response = await fetch(root + path, {
              method,
              headers: {
                ...(body && {'Content-Type':'application/json'}),
                ...(token && {Authorization:'Bearer ' + token})
              },
              body: body ? JSON.stringify(body) : undefined
            });
            assert.ok(response.ok, path + ' returned ' + response.status);
            return response.json();
          };
          const {token} = await json('auth/login', {
            email: process.env.ADMIN_EMAIL, password: process.env.ADMIN_PASSWORD
          });
          const admin = await fetch('http://127.0.0.1:8200/');
          assert.equal(admin.headers.get('x-robots-tag'), 'noindex');
          assert.match(await admin.text(), /name="robots" content="noindex"/);
          const deepl = (await json('catalog/providers', null, token)).items.find(row => row.adapter === 'deepl');
          assert.equal(Number(deepl.has_stored_key), 0);
          await json('providers/' + deepl.id, {enabled:true,cost_inr_per_million:0,api_key:'ci-example-key'}, token, 'PATCH');
          await json('providers/' + deepl.id, {enabled:true,cost_inr_per_million:1}, token, 'PATCH');
          const saved = (await json('catalog/providers', null, token)).items.find(row => row.id === deepl.id);
          assert.equal(Number(saved.has_stored_key), 1);
          assert.ok(!JSON.stringify(saved).includes('ci-example-key'));
          assert.deepEqual((await json('catalog/domains', null, token)).items, []);
          const chinese = await json('languages', {name:'Chinese (Simplified)',code:'zh-hans'}, token);
          assert.equal(chinese.code, 'zh-Hans');
          const {groups, languages} = await json('domain-options', null, token);
          assert.ok(languages.some(language => language.id === chinese.id));
          await json('domains', {
            hostname:'www.fr.ttw.test', origin:'https://www.fr.ttw.test',
            language_id:languages.find(language => language.code === 'fr-FR').id,
            group_id:groups[0].id, daily_limit:null, timezone:'Europe/Paris',
            enabled:true, sitemap_enabled:true, rss_enabled:true, manual_approval:true
          }, token);
          NODE
          docker compose --env-file .env.vps -f compose.vps.yaml exec -T api node -e '
            const assert = require("node:assert/strict");
            const {rows,database} = require("./dist/packages/database/src/db");
            const {decryptProviderCredential,providerCredentialEncryptionKey} = require("./dist/packages/shared/src/provider-credentials");
            rows("SELECT provider_id,encrypted_key FROM provider_credentials").then(([row]) => {
              assert.ok(!row.encrypted_key.includes("ci-example-key"));
              assert.equal(decryptProviderCredential(row.encrypted_key,providerCredentialEncryptionKey(),row.provider_id),"ci-example-key");
            }).catch(error => { console.error(error.message); process.exitCode = 1; }).finally(() => database().end());
          '
          curl -fsS -H 'Host: www.fr.ttw.test' http://127.0.0.1:8201/ | grep -F 'Dernières actualités'
      - name: View logs on failure
        if: failure()
        run: |
          cat api.log worker.log web.log 2>/dev/null || true
          docker compose logs
          docker ps -a --filter label=com.docker.compose.project=ttw-translation
